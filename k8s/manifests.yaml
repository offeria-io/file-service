apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: offeria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      containers:
        - name: file-service
          image: offeria/file-service:latest
          ports:
            - containerPort: 8084
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: offeria
spec:
  selector:
    app: file-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8084
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: file-service-config
  namespace: offeria
data:
  SPRING_PROFILES_ACTIVE: "prod"
